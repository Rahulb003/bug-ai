<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Assistant | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="assistant"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),scan=BugWorkspace.currentScan();root.innerHTML=`<section class="ws-card"><h2>Project assistant</h2><p class="ws-muted">Ask about the active scan. Answers are advisory and refer to stored evidence.</p><div id="thread" class="ws-empty">No messages yet.</div><div class="ws-toolbar" style="margin-top:16px"><input class="ws-input" id="question" placeholder="Explain the highest-priority finding"><button class="ws-button primary" id="ask">Ask</button></div></section>`;document.getElementById("ask").onclick=async()=>{const input=document.getElementById("question"),question=input.value.trim();if(!question)return;const out=await App.askAssistant(question,scan?.id);document.getElementById("thread").innerHTML=`<article class="finding"><strong>BUG AI</strong><p>${BugWorkspace.esc(out.reply)}</p></article>`;};});</script></body></html>
