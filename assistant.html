<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Assistant | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="assistant"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),scan=BugWorkspace.currentScan();root.innerHTML=`<section class="ws-card"><h2>Project assistant</h2><p class="ws-muted">Ask about the active scan, or open a project to ask about the whole codebase. Answers are advisory and refer to stored evidence.</p><div id="thread" class="ws-empty">No messages yet.</div><div class="ws-toolbar" style="margin-top:16px"><input class="ws-input" id="question" placeholder="Where is authentication implemented?"><button class="ws-button primary" id="ask">Ask</button></div></section>`;document.getElementById("ask").onclick=async()=>{const input=document.getElementById("question"),question=input.value.trim();if(!question)return;const thread=document.getElementById("thread");thread.innerHTML="<p class='ws-muted'>Thinking…</p>";try{const out=await App.askAssistant(question,scan?.id,BugWorkspace.selectedProject());const label=out.source==="ai"?"AI · project-aware":"Rule-based · latest scan";const refs=out.referencedFiles?.length?`<p class="ws-muted"><b>Referenced files:</b> ${out.referencedFiles.map(f=>BugWorkspace.esc(f)).join(", ")}</p>`:"";thread.innerHTML=`<article class="finding"><div><strong>BUG AI</strong> <span class="ws-badge">${BugWorkspace.esc(label)}</span></div><p>${BugWorkspace.esc(out.reply)}</p>${refs}</article>`;}catch(error){thread.innerHTML=`<p class="ws-muted">${BugWorkspace.esc(error.message)}</p>`;App.showToast(error.message,"error","Assistant failed");}};});</script></body></html>
