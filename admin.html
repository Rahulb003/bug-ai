<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="motion.css"></head><body class="workspace-page" data-page="admin"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script src="motion.js"></script><script src="pages.js"></script><script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!App.requireAuth()) return;
  const root = document.getElementById("workspace-content");
  const esc = BugWorkspace.esc;
  root.innerHTML = '<p class="ws-muted">Loading administration overview…</p>';
  let data;
  try { data = await App.api("/admin/overview"); }
  catch (error) {
    // The backend enforces the role; this page only renders what it is allowed to see.
    root.innerHTML = BugWorkspace.emptyState({ title: /403|admin|forbidden/i.test(error.message) ? "Admin access required" : "Could not load the overview", body: error.message, actionHref: "dashboard.html", actionLabel: "Back to Dashboard" });
    return;
  }
  const a = data.analytics || {};
  const byType = Object.entries(a.scansByType || {}).sort((x, y) => y[1] - x[1]);
  root.innerHTML = BugPages.header({ title: "Admin", subtitle: "System-wide figures from stored records. Role checks are enforced by the API, not this page.", actions: '<a class="ws-button" href="analytics.html">Analytics</a>' })
  + '<div class="ws-grid cols-3">'
  + '<div class="ws-card"><span class="ws-muted">Users</span><div class="ws-metric">' + data.totalUsers + '</div><p class="ws-muted">' + data.activeUsers + " with at least one scan</p></div>"
  + '<div class="ws-card"><span class="ws-muted">Scans</span><div class="ws-metric">' + data.totalScans + '</div><p class="ws-muted">' + data.activeToday + " today</p></div>"
  + '<div class="ws-card"><span class="ws-muted">Average risk prioritisation</span><div class="ws-metric">' + (data.avgRiskScore === null ? "—" : data.avgRiskScore) + '</div><p class="ws-muted">Severity-weighted triage, not accuracy.</p></div>'
  + "</div>"
  + '<div class="ws-grid cols-2" style="margin-top:16px">'
  + '<div class="ws-card"><span class="ws-muted">Code quality score</span><div class="ws-metric" style="font-size:17px">NOT MEASURED</div><p class="ws-muted">A quality score is not computed by the analysis pipeline.</p></div>'
  + '<div class="ws-card"><span class="ws-muted">Revenue</span><div class="ws-metric" style="font-size:17px">NOT MEASURED</div><p class="ws-muted">' + esc(data.revenue?.reason || "No billing data is recorded.") + "</p></div>"
  + "</div>"
  + '<section class="ws-card" style="margin-top:16px"><h3>Most frequent findings</h3>' + ((data.topBugs || []).length ? '<table class="ws-table"><thead><tr><th>Finding</th><th>Occurrences</th></tr></thead><tbody>' + data.topBugs.map((b) => "<tr><td>" + esc(b.name) + "</td><td>" + b.count + "</td></tr>").join("") + "</tbody></table>" : '<p class="ws-muted">No findings recorded yet.</p>') + "</section>"
  + '<section class="ws-card" style="margin-top:16px"><h3>Scans by input type</h3>' + (byType.length ? '<table class="ws-table"><thead><tr><th>Type</th><th>Count</th></tr></thead><tbody>' + byType.map(([t, n]) => "<tr><td>" + esc(t) + "</td><td>" + n + "</td></tr>").join("") + "</tbody></table>" : '<p class="ws-muted">No scans recorded.</p>') + "</section>";
});
</script></body></html>
