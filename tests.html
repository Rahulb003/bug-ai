<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Lab | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="tests"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content");let input;try{input=JSON.parse(localStorage.getItem("bugai_studio_input")||"null")}catch{};const scan=BugWorkspace.currentScan();input??={code:scan?.sourceCode,filename:scan?.sourceName,language:scan?.language};if(!input?.code){root.innerHTML="<div class='ws-empty'><h2>No code loaded</h2><a class='ws-button primary' href='studio.html'>Open Code Studio</a></div>";return;}root.innerHTML=`<div class="ws-notice">Tests are generated as plans and never overwrite your files. Submitted code is not executed inside the API process.</div><div class="ws-toolbar" style="margin-top:16px"><button class="ws-button primary" id="generate">Generate test plan</button><button class="ws-button" id="verify">Run available verification</button></div><section class="ws-card" style="margin-top:16px"><h2>Results</h2><div id="result" class="ws-empty">Choose an action.</div></section>`;document.getElementById("generate").onclick=async()=>{const out=await App.api("/test/generate",{method:"POST",body:input});const list=out.tests?.length?out.tests.map(t=>`<li><b>${BugWorkspace.esc(t.name)}</b> — ${BugWorkspace.esc(t.intent||"")}${t.code?`<pre class="ws-code">${BugWorkspace.esc(t.code)}</pre>`:""}</li>`).join(""):"";const detail=out.status==="generated"?BugWorkspace.esc(out.framework||""):BugWorkspace.esc(out.reason||out.framework||"");document.getElementById("result").innerHTML=`<p><b>${BugWorkspace.esc(out.status)}</b> · ${detail}</p>`+(list?`<ul class="ws-list">${list}</ul>`:"<div class='ws-empty'>No tests generated.</div>");};document.getElementById("verify").onclick=async()=>{const out=await App.api("/verify",{method:"POST",body:input});document.getElementById("result").innerHTML=`<p><b>${out.status}</b></p><pre class="ws-code">${BugWorkspace.esc(JSON.stringify(out.verification,null,2))}</pre>`;};});</script></body></html>
