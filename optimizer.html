<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optimizer | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="optimizer"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content");let input;try{input=JSON.parse(localStorage.getItem("bugai_optimizer_input")||"null")}catch{};if(!input){root.innerHTML="<div class='ws-empty'><h2>No code loaded</h2><a class='ws-button primary' href='studio.html'>Open Code Studio</a></div>";return;}root.innerHTML=`<div class="ws-toolbar"><select class="ws-select" id="mode"><option value="safe">Safe optimization</option><option value="performance">Performance review</option><option value="readability">Readability review</option><option value="maintainability">Maintainability review</option><option value="security">Security hardening review</option><option value="full">Full review</option></select><button class="ws-button primary" id="run">Generate review</button></div><div id="optimization-note" class="ws-notice" style="margin-top:12px">No code is changed automatically. Only generated patches that change source are shown as a diff and must be reviewed.</div><div class="ws-split" style="margin-top:16px"><section class="ws-card"><h2>Original</h2><pre class="ws-code">${BugWorkspace.esc(input.code)}</pre></section><section class="ws-card"><h2>Proposed output</h2><pre class="ws-code" id="optimized">No optimization run.</pre></section></div><section class="ws-card" style="margin-top:16px"><h2>Change explanation</h2><div id="changes" class="ws-empty">Choose a mode and run a review.</div></section>`;document.getElementById("run").onclick=async()=>{const result=await App.api("/optimize",{method:"POST",body:{...input,mode:document.getElementById("mode").value,strictBehaviorPreservation:true}});document.getElementById("optimized").textContent=result.optimizedCode;document.getElementById("optimization-note").textContent=result.note;document.getElementById("changes").innerHTML=result.changes.length?`<ul>${result.changes.map(c=>`<li>${BugWorkspace.esc(c.explanation)}</li>`).join("")}</ul>`:"No safe source transformation was produced. This is a review, not a claimed optimization.";};});</script></body></html>
