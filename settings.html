<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="settings"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content");root.innerHTML=`<section class="ws-card"><h2>Workspace state</h2><p class="ws-muted">Project and active-file selection are stored only in this browser.</p><p id="state" class="ws-code"></p><button class="ws-button danger" id="clear">Clear local workspace selection</button></section><section class="ws-card" style="margin-top:16px"><h2>Verification environment</h2><p class="ws-muted">Execution, compilation, type checking, linting, and package auditing need an isolated sandbox/toolchain. This server does not run submitted code directly.</p></section>`;document.getElementById("state").textContent=JSON.stringify({project:BugWorkspace.selectedProject(),file:BugWorkspace.selectedFile()},null,2);document.getElementById("clear").onclick=()=>{BugWorkspace.setContext({projectId:"",file:"",scan:null});location.reload();};});</script></body></html>
