<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="analytics"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content");try{const data=await App.getAnalytics();root.innerHTML=`<div class="ws-grid cols-3"><div class="ws-card"><span class="ws-muted">Total scans</span><div class="ws-metric">${data.overview?.totalScans??data.totalScans??0}</div></div><div class="ws-card"><span class="ws-muted">Latest risk</span><div class="ws-metric">${data.overview?.latestRisk??"N/A"}</div></div><div class="ws-card"><span class="ws-muted">Evaluation</span><div class="ws-metric">N/A</div><p class="ws-muted">Benchmark not configured.</p></div></div><section class="ws-card" style="margin-top:16px"><h2>Stored analytics</h2><pre class="ws-code">${BugWorkspace.esc(JSON.stringify(data,null,2))}</pre></section>`;}catch(e){root.innerHTML=`<div class="ws-empty">${BugWorkspace.esc(e.message)}</div>`;}});</script></body></html>
