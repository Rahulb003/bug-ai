<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | BUG AI</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><div class="auth-bg"></div>
<div class="auth-wrap">
  <header class="auth-top">
    <a class="auth-brand" href="index.html"><span class="ws-brand-mark" id="brand-mark"></span><span><b>BUG AI</b><small>Code Smarter. Build Safer.</small></span></a>
    <nav class="auth-nav"><a class="ws-button" href="signup.html">Create account</a></nav>
  </header>
  <section class="ws-card auth-card m-rise">
    <h2>Sign in</h2>
    <p>Continue to your projects and scans.</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Username or email</label>
      <input class="ws-input" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input class="ws-input" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="ws-button primary" id="login-btn" type="submit">Sign in</button>
    </form>
    <div class="auth-status" id="server-status"></div>
    <p class="alt">New here? <a href="signup.html">Create an account</a></p>
  </section>
</div>
<script src="ui.js"></script><script src="brand.js"></script><script src="workspace.js"></script><script src="motion.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("brand-mark").innerHTML = BugBrand.mark({ size: 22 });
  if (App.isAuthenticated()) { location.replace("dashboard.html"); return; }
  if (window.BugMotion) BugMotion.boot({ short: false }); // startup plays on whichever page opens the site
  const status = document.getElementById("server-status");
  const ok = await App.checkServerConnection();
  status.textContent = ok ? "" : "Backend not reachable. Start the server with npm start, then refresh.";
  status.classList.toggle("bad", !ok);
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const btn = document.getElementById("login-btn");
    try {
      await BugMotion.busy(btn, App.api("/auth/login", { method: "POST", body: { username: document.getElementById("username").value, password: document.getElementById("password").value } }).then((session) => { App.saveSession(session); }), { busyLabel: "Signing in…", doneLabel: "✓ Signed in", holdMs: 300 });
      location.href = "dashboard.html";
    } catch (error) { status.textContent = error.message; status.classList.add("bad"); }
  });
});
</script></body></html>
