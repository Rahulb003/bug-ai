<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="history"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script src="pages.js"></script><script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!App.requireAuth()) return;
  const root = document.getElementById("workspace-content");
  const esc = BugWorkspace.esc;
  root.innerHTML = '<p class="ws-muted">Loading stored scans…</p>';
  let scans = [];
  try { scans = (await App.api("/history")).scans || []; }
  catch (error) { root.innerHTML = BugWorkspace.emptyState({ title: "Could not load history", body: error.message }); return; }

  if (!scans.length) {
    root.innerHTML = BugPages.header({ title: "History", subtitle: "Every stored scan, fix and verification." })
      + BugWorkspace.emptyState({ title: "No history yet", body: "Previous scans will appear here once you analyze something.", actionHref: "studio.html", actionLabel: "Open Code Studio" });
    return;
  }

  const sevClass = (level) => String(level || "low").toLowerCase();
  const current = BugWorkspace.currentScan();
  root.innerHTML = BugPages.header({ title: "History", subtitle: scans.length + " stored scan(s). Select two to compare.", actions: '<button class="ws-button" id="compare" disabled>Compare selected</button><a class="ws-button" href="analytics.html">Analytics</a>' })
  + '<div id="compare-out"></div>'
  + '<table class="ws-table"><thead><tr><th></th><th>When</th><th>Source</th><th>Type</th><th>Findings</th><th>Risk</th><th>Verification</th><th></th></tr></thead><tbody>'
  + scans.map((s) => '<tr' + (current && current.id === s.id ? ' class="selected-row"' : "") + '><td><input type="checkbox" data-pick="' + esc(s.id) + '" aria-label="Select scan"></td>'
    + "<td>" + esc(new Date(s.createdAt).toLocaleString()) + "</td>"
    + "<td>" + esc(s.sourceName || "snippet") + (s.ownerName && !s.isMine ? ' <small class="ws-muted">by ' + esc(s.ownerName) + "</small>" : "") + "</td>"
    + "<td>" + esc(s.inputType || "code") + "</td>"
    + "<td>" + ((s.findings || s.bugs || []).length) + "</td>"
    + '<td><span class="ws-badge ' + sevClass(s.riskLevel) + '">' + esc(String(s.riskScore ?? "—")) + " " + esc(s.riskLevel || "") + "</span></td>"
    + "<td>" + esc(String(s.verification?.status || "NOT RUN").replaceAll("_", " ")) + "</td>"
    + '<td><button class="ws-button" data-load="' + esc(s.id) + '">Load</button> <button class="ws-button" data-export="' + esc(s.id) + '">Export</button></td></tr>').join("")
  + "</tbody></table>";

  const picks = () => [...document.querySelectorAll("[data-pick]:checked")].map((c) => c.dataset.pick);
  document.querySelectorAll("[data-pick]").forEach((c) => c.onchange = () => { document.getElementById("compare").disabled = picks().length !== 2; });
  document.querySelectorAll("[data-load]").forEach((b) => b.onclick = async () => {
    try {
      const { scan } = await App.api("/scans/" + b.dataset.load);
      BugWorkspace.setContext({ scan, file: scan.sourceName || "" });
      App.showToast("Scan loaded as the current analysis.", "success", "Loaded");
      location.href = "analyzer.html";
    } catch (error) { App.showToast(error.message, "error", "Load failed"); }
  });
  document.querySelectorAll("[data-export]").forEach((b) => b.onclick = async () => {
    try { await App.exportReport(b.dataset.export, "json"); } catch (error) { App.showToast(error.message, "error", "Export failed"); }
  });

  document.getElementById("compare").onclick = async () => {
    const [previous, currentId] = picks();
    const out = document.getElementById("compare-out");
    out.innerHTML = '<p class="ws-muted">Comparing…</p>';
    try {
      const c = await App.api("/history/compare", { method: "POST", body: { currentScanId: currentId, previousScanId: previous } });
      const d = c.delta || {};
      const sign = (n) => (n > 0 ? "+" + n : String(n));
      out.innerHTML = '<section class="ws-card" style="margin-bottom:16px"><h3>Comparison</h3><p class="ws-muted">' + esc(c.previous?.sourceName || "previous") + " → " + esc(c.current?.sourceName || "current") + "</p>"
        + '<div class="ws-grid cols-3"><div class="ws-card"><span class="ws-muted">Risk prioritisation</span><div class="ws-metric">' + sign(d.riskScore ?? 0) + "</div></div>"
        + '<div class="ws-card"><span class="ws-muted">Findings</span><div class="ws-metric">' + sign(d.bugCount ?? 0) + "</div></div>"
        + '<div class="ws-card"><span class="ws-muted">Quality score</span><div class="ws-metric" style="font-size:17px">NOT MEASURED</div><p class="ws-muted">Not computed by the pipeline.</p></div></div></section>';
    } catch (error) { out.innerHTML = BugWorkspace.emptyState({ title: "Comparison failed", body: error.message }); }
  };
});
</script></body></html>
