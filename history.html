<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="motion.css"></head><body class="workspace-page" data-page="history"><div id="workspace-shell"></div><script src="ui.js"></script><script src="brand.js"></script><script src="workspace.js"></script><script src="motion.js"></script><script src="pages.js"></script><script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!App.requireAuth()) return;
  const root = document.getElementById("workspace-content");
  const esc = BugWorkspace.esc;
  root.innerHTML = '<p class="ws-muted">Loading stored scans…</p>';
  let scans = [];
  const pid = BugWorkspace.selectedProject();
  if (pid) { try { window.__revisions = (await App.api("/projects/" + pid + "/revisions")).revisions || []; } catch { window.__revisions = []; } }
  try { scans = (await App.api("/history")).scans || []; }
  catch (error) { root.innerHTML = BugWorkspace.emptyState({ title: "Could not load history", body: error.message }); return; }

  if (!scans.length && !(window.__revisions || []).length) {
    root.innerHTML = BugPages.header({ title: "History", subtitle: "Every stored scan, fix and verification." })
      + BugWorkspace.emptyState({ title: "No history yet", body: "Previous scans will appear here once you analyze something.", actionHref: "studio.html", actionLabel: "Open Code Studio" });
    return;
  }

  const sevClass = (level) => String(level || "low").toLowerCase();
  const current = BugWorkspace.currentScan();
  root.innerHTML = BugPages.header({ title: "History", subtitle: scans.length + " stored scan(s). Select two to compare.", actions: '<button class="ws-button" id="compare" disabled>Compare selected</button><a class="ws-button" href="analytics.html">Analytics</a>' })
  + '<div id="compare-out"></div>'
  + '<table class="ws-table"><thead><tr><th></th><th>When</th><th>Source</th><th>Type</th><th>Findings</th><th>Risk</th><th>Verification</th><th></th></tr></thead><tbody>'
  + scans.map((s) => '<tr' + (current && current.id === s.id ? ' class="selected-row"' : "") + '><td><input type="checkbox" data-pick="' + esc(s.id) + '" aria-label="Select scan"></td>'
    + "<td>" + esc(new Date(s.createdAt).toLocaleString()) + "</td>"
    + "<td>" + esc(s.sourceName || "snippet") + (s.ownerName && !s.isMine ? ' <small class="ws-muted">by ' + esc(s.ownerName) + "</small>" : "") + "</td>"
    + "<td>" + esc(s.inputType || "code") + "</td>"
    + "<td>" + ((s.findings || s.bugs || []).length) + "</td>"
    + '<td><span class="ws-badge ' + sevClass(s.riskLevel) + '">' + esc(String(s.riskScore ?? "—")) + " " + esc(s.riskLevel || "") + "</span></td>"
    + "<td>" + esc(String(s.verification?.status || "NOT RUN").replaceAll("_", " ")) + "</td>"
    + '<td><button class="ws-button" data-studio="' + esc(s.id) + '">Open in Studio</button> <button class="ws-button" data-load="' + esc(s.id) + '">View Findings</button> <button class="ws-button" data-export="' + esc(s.id) + '">Export</button></td></tr>').join("")
  + "</tbody></table>"
  // Code timeline: the same stored scans grouped by day. Fixes and revisions
  // are not stored as events yet, so only scans appear here — nothing is invented.
  + (function () {
    const revisions = window.__revisions || [];
    const dayLabel = (d) => { const t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1); const k = (x) => x.toDateString(); return k(d) === k(t) ? "Today" : k(d) === k(y) ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: d.getFullYear() === t.getFullYear() ? undefined : "numeric" }); };
    const groups = new Map();
    const label = { manual: "Manual edit", "ai-fix": "AI fix", repair: "Fix & Verify", optimization: "Optimization", translation: "Translation", restore: "Restore" };
    const events = [...scans.map((sc) => ({ kind: "scan", at: sc.createdAt, sc })), ...revisions.map((r) => ({ kind: "revision", at: r.createdAt, r }))].sort((x, y) => new Date(y.at) - new Date(x.at));
    events.forEach((ev) => { const l = dayLabel(new Date(ev.at)); if (!groups.has(l)) groups.set(l, []); groups.get(l).push(ev); });
    return '<section class="pg-section"><div class="pg-section-head"><h3>Code timeline</h3><span class="ws-muted" style="font-size:12px">Stored scans and file revisions of the selected project, by day</span></div><div class="tl-days">'
      + [...groups].map(([day, list]) => '<div class="tl-day"><h4>' + esc(day) + "</h4>" + list.map((ev) => ev.kind === "scan"
        ? '<button type="button" class="tl-ev" data-tl="' + esc(ev.sc.id) + '"><span class="tl-dot ' + sevClass(ev.sc.riskLevel) + '"></span><time>' + esc(new Date(ev.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })) + "</time><b>Scan</b><span>" + esc(ev.sc.sourceName || "snippet") + "</span><small>" + ((ev.sc.findings || ev.sc.bugs || []).length) + " finding(s) · " + esc(String(ev.sc.verification?.status || "NOT RUN").replaceAll("_", " ")) + "</small></button>"
        : '<button type="button" class="tl-ev" data-rev="' + esc(ev.r.id) + '" data-file="' + esc(ev.r.file) + '"><span class="tl-dot rev"></span><time>' + esc(new Date(ev.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })) + "</time><b>" + esc(label[ev.r.source] || ev.r.source) + "</b><span>" + esc(ev.r.file) + "</span><small>" + ev.r.bytesBefore + " → " + ev.r.bytesAfter + " bytes · compare</small></button>").join("") + "</div>").join("")
      + "</div></section>";
  })();

  document.querySelectorAll("[data-tl]").forEach((b) => b.onclick = () => { location.href = "analyzer.html?scanId=" + encodeURIComponent(b.dataset.tl); });
  document.querySelectorAll("[data-rev]").forEach((b) => b.onclick = () => BugWorkspace.openInStudio({ file: b.dataset.file, revision: b.dataset.rev }));

  const picks = () => [...document.querySelectorAll("[data-pick]:checked")].map((c) => c.dataset.pick);
  document.querySelectorAll("[data-pick]").forEach((c) => c.onchange = () => { document.getElementById("compare").disabled = picks().length !== 2; });
  // View Findings -> Analyzer with the same scan; Open in Studio -> Studio with
  // the same scan and file. Neither triggers a new scan.
  document.querySelectorAll("[data-load]").forEach((b) => b.onclick = () => { location.href = "analyzer.html?scanId=" + encodeURIComponent(b.dataset.load); });
  document.querySelectorAll("[data-studio]").forEach((b) => b.onclick = () => {
    const s = scans.find((x) => x.id === b.dataset.studio);
    BugWorkspace.openInStudio({ scanId: b.dataset.studio, file: s && s.inputType === "code" ? (s.sourceName || "") : "" });
  });
  document.querySelectorAll("[data-export]").forEach((b) => b.onclick = async () => {
    try { await App.exportReport(b.dataset.export, "json"); } catch (error) { App.showToast(error.message, "error", "Export failed"); }
  });

  document.getElementById("compare").onclick = async () => {
    const [previous, currentId] = picks();
    const out = document.getElementById("compare-out");
    out.innerHTML = '<p class="ws-muted">Comparing…</p>';
    try {
      const c = await App.api("/history/compare", { method: "POST", body: { currentScanId: currentId, previousScanId: previous } });
      const d = c.delta || {};
      const sign = (n) => (n > 0 ? "+" + n : String(n));
      out.innerHTML = '<section class="ws-card" style="margin-bottom:16px"><h3>Comparison</h3><p class="ws-muted">' + esc(c.previous?.sourceName || "previous") + " → " + esc(c.current?.sourceName || "current") + "</p>"
        + '<div class="ws-grid cols-3"><div class="ws-card"><span class="ws-muted">Risk prioritisation</span><div class="ws-metric">' + sign(d.riskScore ?? 0) + "</div></div>"
        + '<div class="ws-card"><span class="ws-muted">Findings</span><div class="ws-metric">' + sign(d.bugCount ?? 0) + "</div></div>"
        + '<div class="ws-card"><span class="ws-muted">Quality score</span><div class="ws-metric" style="font-size:17px">NOT MEASURED</div><p class="ws-muted">Not computed by the pipeline.</p></div></div></section>';
    } catch (error) { out.innerHTML = BugWorkspace.emptyState({ title: "Comparison failed", body: error.message }); }
  };
});
</script></body></html>
