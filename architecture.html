<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="architecture"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),id=BugWorkspace.selectedProject();if(!id){root.innerHTML="<div class='ws-empty'><h2>No project selected</h2><p>Architecture needs persisted project files.</p><a class='ws-button primary' href='projects.html'>Open Projects</a></div>";return;}try{const {architecture}=await App.api(`/projects/${id}/architecture`);root.innerHTML=`<div class="ws-notice">${BugWorkspace.esc(architecture.notes.join(" "))}</div><section class="ws-card" style="margin-top:16px"><h2>Components</h2><table class="ws-table"><thead><tr><th>File</th><th>Layer</th><th>Language</th></tr></thead><tbody>${architecture.components.map(c=>`<tr><td>${BugWorkspace.esc(c.file)}</td><td>${BugWorkspace.esc(c.layer)}</td><td>${BugWorkspace.esc(c.language)}</td></tr>`).join("")}</tbody></table></section><section class="ws-card" style="margin-top:16px"><h2>Internal relationships</h2>${architecture.relationships.length?`<ul>${architecture.relationships.map(r=>`<li>${BugWorkspace.esc(r.from)} → ${BugWorkspace.esc(r.target)}</li>`).join("")}</ul>`:"<p class=\"ws-muted\">No static internal imports detected.</p>"}</section>`;}catch(e){root.innerHTML=`<div class="ws-empty">${BugWorkspace.esc(e.message)}</div>`;}});</script></body></html>
