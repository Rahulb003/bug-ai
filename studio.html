<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Studio | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.js"></script></head><body class="workspace-page" data-page="studio"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!App.requireAuth()) return; const root=document.getElementById("workspace-content");
  root.innerHTML=`<div class="studio-grid"><section class="ws-card"><div class="ws-toolbar"><strong>Explorer</strong><button class="ws-button" id="refresh-projects">↻</button></div><p class="ws-muted">Open a persisted project or paste a standalone file.</p><ul class="ws-list" id="project-list"></ul><hr><ul class="ws-list" id="file-list"><li class="ws-muted">Select a project to browse files.</li></ul></section><section class="ws-card"><div class="ws-toolbar"><input class="ws-input" id="studio-name" value="scratch.py" aria-label="Filename"><select class="ws-select" id="studio-language"><option value="auto">Auto detect</option><option value="python">Python</option><option value="javascript">JavaScript</option><option value="typescript">TypeScript</option><option value="java">Java</option><option value="c">C</option><option value="cpp">C++</option><option value="csharp">C#</option><option value="go">Go</option><option value="rust">Rust</option><option value="php">PHP</option><option value="ruby">Ruby</option><option value="sql">SQL</option></select></div><div class="studio-tabs" id="studio-tabs"></div><div id="studio-editor" class="studio-editor"></div><div class="ws-toolbar" style="margin-top:12px"><button class="ws-button primary" id="analyze">Analyze</button><button class="ws-button" id="save-file">Save file</button><button class="ws-button" id="fix">Fix proposals</button><button class="ws-button" id="optimize">Optimize</button><button class="ws-button" id="tests">Generate tests</button><button class="ws-button" id="verify">Verify</button></div><p class="ws-muted" id="studio-status">Code is analyzed locally by deterministic rules; optional AI reasoning is separately labeled.</p></section><aside class="ws-card"><strong>Findings</strong><div id="studio-findings" class="ws-empty">Analyze code to show evidence-backed findings here.</div></aside></div>`;

  function loadMonaco(){return new Promise((resolve,reject)=>{require.config({paths:{vs:"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs"}});require(["vs/editor/editor.main"],resolve,reject);});}
  try { await loadMonaco(); } catch(error){ document.getElementById("studio-status").textContent="The editor could not be loaded from the CDN. Check your connection and reload."; App.showToast("Monaco editor could not be loaded.","error","Editor unavailable"); return; }

  const openFiles=[]; let activeIndex=-1;
  const nameInput=document.getElementById("studio-name"), langSelect=document.getElementById("studio-language");
  const monacoLangFor=(id)=> id && id!=="auto" ? id : "plaintext";

  const editor=monaco.editor.create(document.getElementById("studio-editor"),{
    automaticLayout:true,
    theme:document.documentElement.getAttribute("data-theme")==="light"?"vs":"vs-dark",
    minimap:{enabled:true}, scrollBeyondLastLine:false, fontSize:13
  });

  const code=()=>editor.getModel()?.getValue()||"";
  const name=()=>openFiles[activeIndex]?.name||"scratch.py";
  const lang=()=>openFiles[activeIndex]?.language||"auto";

  function severityToMonaco(sev){const s=String(sev||"").toUpperCase(); if(s==="CRITICAL"||s==="HIGH")return monaco.MarkerSeverity.Error; if(s==="MEDIUM")return monaco.MarkerSeverity.Warning; return monaco.MarkerSeverity.Info;}
  function applyMarkers(findings){const model=editor.getModel(); if(!model)return; monaco.editor.setModelMarkers(model,"bugai",(findings||[]).map(f=>({startLineNumber:f.line||1,startColumn:f.column||1,endLineNumber:f.endLine||f.line||1,endColumn:f.endColumn||(f.column||1)+1,message:`${f.title}: ${f.description}`,severity:severityToMonaco(f.severity)})));}

  function renderTabs(){
    const bar=document.getElementById("studio-tabs");
    bar.innerHTML=openFiles.map((f,i)=>`<div class="studio-tab ${i===activeIndex?"active":""}" data-tab="${i}" title="${BugWorkspace.esc(f.name)}">${BugWorkspace.esc(f.name)}${f.dirty?" •":""}<span class="close" data-close="${i}" role="button" aria-label="Close file">×</span></div>`).join("");
    bar.querySelectorAll("[data-tab]").forEach(el=>el.onclick=(e)=>{if(!e.target.dataset.close)activateTab(+el.dataset.tab);});
    bar.querySelectorAll("[data-close]").forEach(el=>el.onclick=(e)=>{e.stopPropagation();closeTab(+el.dataset.close);});
  }

  function syncToolbar(){const file=openFiles[activeIndex]; if(!file)return; nameInput.value=file.name; langSelect.value=file.language||"auto";}

  function activateTab(index){
    if(index<0||index>=openFiles.length)return;
    if(activeIndex>=0&&openFiles[activeIndex]) openFiles[activeIndex].viewState=editor.saveViewState();
    activeIndex=index; editor.setModel(openFiles[index].model); syncToolbar(); renderTabs();
    if(openFiles[index].viewState) editor.restoreViewState(openFiles[index].viewState);
    editor.focus();
  }

  function openTab({name:fileName,content,language}){
    const existing=openFiles.findIndex(f=>f.name===fileName);
    if(existing>=0){activateTab(existing);return;}
    if(activeIndex>=0&&openFiles[activeIndex]) openFiles[activeIndex].viewState=editor.saveViewState();
    const model=monaco.editor.createModel(String(content??""),monacoLangFor(language));
    const entry={name:fileName,language:language||"auto",model,dirty:false,viewState:null};
    model.onDidChangeContent(()=>{if(!entry.dirty){entry.dirty=true;renderTabs();}});
    openFiles.push(entry); activeIndex=openFiles.length-1;
    editor.setModel(model); applyMarkers([]); syncToolbar(); renderTabs(); editor.focus();
  }

  function closeTab(index){
    openFiles[index].model.dispose(); openFiles.splice(index,1);
    if(activeIndex>=openFiles.length)activeIndex=openFiles.length-1;
    if(activeIndex>=0){editor.setModel(openFiles[activeIndex].model);syncToolbar();} else {editor.setModel(null);}
    renderTabs();
  }

  // The toolbar fields stay authoritative for whichever tab is active.
  nameInput.oninput=()=>{if(openFiles[activeIndex]){openFiles[activeIndex].name=nameInput.value||"scratch.py";renderTabs();}};
  langSelect.onchange=()=>{const file=openFiles[activeIndex]; if(!file)return; file.language=langSelect.value; monaco.editor.setModelLanguage(file.model,monacoLangFor(file.language));};

  new MutationObserver(()=>{monaco.editor.setTheme(document.documentElement.getAttribute("data-theme")==="light"?"vs":"vs-dark");}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

  openTab({name:"scratch.py",content:"def example(value):\n    return eval(value) / 0",language:"auto"});

  async function showProjects(){const projects=await BugWorkspace.loadProjects(); const list=document.getElementById("project-list"); list.innerHTML=projects.length?projects.map(p=>`<li><button data-project="${p.id}">${BugWorkspace.esc(p.name)}<small class="ws-muted"> · ${p.fileCount} files</small></button></li>`).join(""):"<li class=\"ws-muted\">No saved projects.</li>"; list.querySelectorAll("[data-project]").forEach(button=>button.onclick=()=>openProject(button.dataset.project));}
  async function openProject(id){const data=await App.api(`/projects/${id}/files`); BugWorkspace.setContext({projectId:id}); const files=document.getElementById("file-list"); files.innerHTML=data.files.map(file=>`<li><button data-file="${encodeURIComponent(file.name)}">${BugWorkspace.esc(file.name)}</button></li>`).join("")||"<li class=\"ws-muted\">No files</li>"; files.querySelectorAll("[data-file]").forEach(button=>button.onclick=()=>{const file=data.files.find(item=>item.name===decodeURIComponent(button.dataset.file)); openTab({name:file.name,content:file.content,language:file.language||"auto"}); BugWorkspace.setContext({file:file.name});});}
  async function analyze(){const status=document.getElementById("studio-status"); status.textContent="Analyzing…"; try {const scan=await App.api("/scan-code",{method:"POST",body:{code:code(),filename:name(),language:lang()}}); BugWorkspace.setContext({file:name(),scan}); applyMarkers(scan.findings||[]); if(lang()==="auto"&&scan.language&&editor.getModel())monaco.editor.setModelLanguage(editor.getModel(),monacoLangFor(scan.language)); document.getElementById("studio-findings").innerHTML=scan.findings?.length?scan.findings.map(BugWorkspace.findingCard).join(""):"<div class=\"ws-empty\">No detected issues from available checks.</div>"; status.textContent=`Completed: ${scan.summary.totalFindings} findings · ${scan.verification.status.replaceAll("_"," ")}. Code is analyzed locally by deterministic rules; optional AI reasoning is separately labeled.`; } catch(error){status.textContent=error.message; App.showToast(error.message,"error","Analysis failed");}}
  document.getElementById("analyze").onclick=analyze; document.getElementById("refresh-projects").onclick=showProjects;
  document.getElementById("save-file").onclick=async()=>{const id=BugWorkspace.selectedProject(); if(!id)return App.showToast("Create or select a project first.","warning","No project"); try{await App.api(`/projects/${id}/files`,{method:"PUT",body:{name:name(),content:code()}}); BugWorkspace.setContext({file:name()}); if(openFiles[activeIndex]){openFiles[activeIndex].dirty=false;renderTabs();} App.showToast("File saved to the selected project."); await openProject(id);}catch(error){App.showToast(error.message,"error","Save failed");}};
  document.getElementById("fix").onclick=async()=>{try{const out=await App.api("/fix",{method:"POST",body:{code:code(),filename:name(),language:lang()}}); document.getElementById("studio-findings").innerHTML=out.fixes.length?out.fixes.map(f=>`<article class="finding"><strong>Fix proposal</strong> <span class="ws-badge">${BugWorkspace.esc(f.source||"deterministic")}</span><pre class="ws-code">${BugWorkspace.esc(f.suggestedFix)}</pre>${f.explanation?`<p class="ws-muted">${BugWorkspace.esc(f.explanation)}</p>`:""}<p class="ws-muted">Verification: ${BugWorkspace.esc(f.verification)}</p></article>`).join(""):"<div class=\"ws-empty\">No automatically applicable safe fixes. Review findings manually.</div>";}catch(error){App.showToast(error.message,"error","Fix failed");}};
  document.getElementById("optimize").onclick=()=>{localStorage.setItem("bugai_optimizer_input",JSON.stringify({code:code(),filename:name(),language:lang()})); location.href="optimizer.html";};
  document.getElementById("tests").onclick=()=>{localStorage.setItem("bugai_studio_input",JSON.stringify({code:code(),filename:name(),language:lang()})); location.href="tests.html";}; document.getElementById("verify").onclick=()=>{localStorage.setItem("bugai_studio_input",JSON.stringify({code:code(),filename:name(),language:lang()})); location.href="tests.html#verify";}; await showProjects(); if(BugWorkspace.selectedProject()) openProject(BugWorkspace.selectedProject());
});
</script></body></html>
