<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Studio | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="studio"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!App.requireAuth()) return; const root=document.getElementById("workspace-content");
  root.innerHTML=`<div class="studio-grid"><section class="ws-card"><div class="ws-toolbar"><strong>Explorer</strong><button class="ws-button" id="refresh-projects">↻</button></div><p class="ws-muted">Open a persisted project or paste a standalone file.</p><ul class="ws-list" id="project-list"></ul><hr><ul class="ws-list" id="file-list"><li class="ws-muted">Select a project to browse files.</li></ul></section><section class="ws-card"><div class="ws-toolbar"><input class="ws-input" id="studio-name" value="scratch.py" aria-label="Filename"><select class="ws-select" id="studio-language"><option value="auto">Auto detect</option><option value="python">Python</option><option value="javascript">JavaScript</option><option value="typescript">TypeScript</option><option value="java">Java</option><option value="c">C</option><option value="cpp">C++</option><option value="csharp">C#</option><option value="go">Go</option><option value="rust">Rust</option><option value="php">PHP</option><option value="ruby">Ruby</option><option value="sql">SQL</option></select></div><textarea class="ws-textarea" id="studio-code" spellcheck="false" aria-label="Code editor">def example(value):
    return eval(value) / 0</textarea><div class="ws-toolbar" style="margin-top:12px"><button class="ws-button primary" id="analyze">Analyze</button><button class="ws-button" id="save-file">Save file</button><button class="ws-button" id="fix">Fix proposals</button><button class="ws-button" id="optimize">Optimize</button><button class="ws-button" id="tests">Generate tests</button><button class="ws-button" id="verify">Verify</button></div><p class="ws-muted" id="studio-status">Code is analyzed locally by deterministic rules; optional AI reasoning is separately labeled.</p></section><aside class="ws-card"><strong>Findings</strong><div id="studio-findings" class="ws-empty">Analyze code to show evidence-backed findings here.</div></aside></div>`;
  const code=()=>document.getElementById("studio-code").value, name=()=>document.getElementById("studio-name").value, lang=()=>document.getElementById("studio-language").value;
  async function showProjects(){const projects=await BugWorkspace.loadProjects(); const list=document.getElementById("project-list"); list.innerHTML=projects.length?projects.map(p=>`<li><button data-project="${p.id}">${BugWorkspace.esc(p.name)}<small class="ws-muted"> · ${p.fileCount} files</small></button></li>`).join(""):"<li class=\"ws-muted\">No saved projects.</li>"; list.querySelectorAll("[data-project]").forEach(button=>button.onclick=()=>openProject(button.dataset.project));}
  async function openProject(id){const data=await App.api(`/projects/${id}/files`); BugWorkspace.setContext({projectId:id}); const files=document.getElementById("file-list"); files.innerHTML=data.files.map(file=>`<li><button data-file="${encodeURIComponent(file.name)}">${BugWorkspace.esc(file.name)}</button></li>`).join("")||"<li class=\"ws-muted\">No files</li>"; files.querySelectorAll("[data-file]").forEach(button=>button.onclick=()=>{const file=data.files.find(item=>item.name===decodeURIComponent(button.dataset.file)); document.getElementById("studio-name").value=file.name; document.getElementById("studio-code").value=file.content; document.getElementById("studio-language").value=file.language||"auto"; BugWorkspace.setContext({file:file.name});});}
  async function analyze(){const status=document.getElementById("studio-status"); status.textContent="Analyzing…"; try {const scan=await App.api("/scan-code",{method:"POST",body:{code:code(),filename:name(),language:lang()}}); BugWorkspace.setContext({file:name(),scan}); document.getElementById("studio-findings").innerHTML=scan.findings?.length?scan.findings.map(BugWorkspace.findingCard).join(""):"<div class=\"ws-empty\">No detected issues from available checks.</div>"; status.textContent=`Completed: ${scan.summary.totalFindings} findings · ${scan.verification.status.replaceAll("_"," ")}.`; } catch(error){status.textContent=error.message; App.showToast(error.message,"error","Analysis failed");}}
  document.getElementById("analyze").onclick=analyze; document.getElementById("refresh-projects").onclick=showProjects;
  document.getElementById("save-file").onclick=async()=>{const id=BugWorkspace.selectedProject(); if(!id)return App.showToast("Create or select a project first.","warning","No project"); try{await App.api(`/projects/${id}/files`,{method:"PUT",body:{name:name(),content:code()}}); BugWorkspace.setContext({file:name()}); App.showToast("File saved to the selected project."); await openProject(id);}catch(error){App.showToast(error.message,"error","Save failed");}};
  document.getElementById("fix").onclick=async()=>{try{const out=await App.api("/fix",{method:"POST",body:{code:code(),filename:name(),language:lang()}}); document.getElementById("studio-findings").innerHTML=out.fixes.length?out.fixes.map(f=>`<article class="finding"><strong>Fix proposal</strong><p>${BugWorkspace.esc(f.suggestedFix)}</p><p class="ws-muted">Verification: ${f.verification}</p></article>`).join(""):"<div class=\"ws-empty\">No automatically applicable safe fixes. Review findings manually.</div>";}catch(error){App.showToast(error.message,"error","Fix failed");}};
  document.getElementById("optimize").onclick=()=>{localStorage.setItem("bugai_optimizer_input",JSON.stringify({code:code(),filename:name(),language:lang()})); location.href="optimizer.html";};
  document.getElementById("tests").onclick=()=>{localStorage.setItem("bugai_studio_input",JSON.stringify({code:code(),filename:name(),language:lang()})); location.href="tests.html";}; document.getElementById("verify").onclick=()=>{localStorage.setItem("bugai_studio_input",JSON.stringify({code:code(),filename:name(),language:lang()})); location.href="tests.html#verify";}; await showProjects(); if(BugWorkspace.selectedProject()) openProject(BugWorkspace.selectedProject());
});
</script></body></html>
