<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git / GitHub | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="git"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content");root.innerHTML=`<div class="ws-notice">BUG AI can statically import a public GitHub repository from Code Studio or the existing Workspace. Local Git status, commits, and push actions are not available because the server does not access your working directory.</div><section class="ws-card" style="margin-top:16px"><div class="ws-toolbar"><h2 style="margin:0">CI templates</h2><button class="ws-button" id="load">Load templates</button></div><div id="templates" class="ws-empty">Templates are available for copying after loading.</div></section>`;document.getElementById("load").onclick=async()=>{const templates=await App.getDevopsTemplates();document.getElementById("templates").innerHTML=Object.entries(templates).map(([name,content])=>`<h3>${BugWorkspace.esc(name)}</h3><pre class="ws-code">${BugWorkspace.esc(content)}</pre>`).join("");};});</script></body></html>
