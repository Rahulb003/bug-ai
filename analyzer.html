<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Analyzer | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="motion.css"></head><body class="workspace-page" data-page="analyzer"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script src="motion.js"></script><script src="pages.js"></script><script>
document.addEventListener("DOMContentLoaded", async () => {
  if (!App.requireAuth()) return;
  const root = document.getElementById("workspace-content");
  await BugWorkspace.resolveScanFromUrl();
  const scan = BugWorkspace.currentScan();
  if (!scan) {
    root.innerHTML = BugWorkspace.emptyState({ title: "No analysis yet", body: "Open Code Studio, analyze a file, then return here to work through the findings.", actionHref: "studio.html", actionLabel: "Open Code Studio" });
    return;
  }
  const findings = scan.findings || [];
  const categories = [...new Set(findings.map((f) => f.category).filter(Boolean))].sort();
  root.innerHTML = BugPages.header({
    title: "Bug Analyzer",
    subtitle: (scan.sourceName || "Live snippet") + " · " + (scan.language || "unknown") + " · risk prioritisation " + scan.riskScore + " (not an accuracy metric)",
    actions: '<span class="ws-badge pg-count"></span><a class="ws-button" href="studio.html">Back to Studio</a>'
  }) + BugPages.severityBar(findings) + BugPages.toolbar({ categories, id: "an" }) + '<div class="pg-list"></div>';
  if (!findings.length) {
    root.querySelector(".pg-list").innerHTML = BugWorkspace.emptyState({ title: "No findings", body: "No configured rule matched this source. That is not a proof of correctness." });
    return;
  }
  BugPages.wireList({ container: root, findings, id: "an" });
});
</script></body></html>
