<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Analyzer | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="analyzer"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),scan=BugWorkspace.requireScan(root);if(!scan)return;root.innerHTML=`<div class="ws-grid cols-3"><div class="ws-card"><span class="ws-muted">Findings</span><div class="ws-metric">${scan.summary.totalFindings}</div></div><div class="ws-card"><span class="ws-muted">Risk prioritisation</span><div class="ws-metric">${scan.riskScore}</div><p class="ws-muted">Not an accuracy metric.</p></div><div class="ws-card"><span class="ws-muted">Verification</span><div class="ws-metric">${scan.verification?.status||"NOT RUN"}</div></div></div><section class="ws-card" style="margin-top:16px"><div class="ws-toolbar"><h2 style="margin:0">Evidence-backed findings</h2><a class="ws-button" href="studio.html">Open source</a></div>${scan.findings?.length?scan.findings.map(BugWorkspace.findingCard).join(""):"<div class=\"ws-empty\">No detected issues from available checks.</div>"}</section>`;});</script></body></html>
