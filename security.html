<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Center | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="security"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),scan=BugWorkspace.requireScan(root);if(!scan)return;const items=(scan.findings||[]).filter(x=>x.category==="security");root.innerHTML=`<div class="ws-notice">Static security rules completed for the active scan. Dependency vulnerability and runtime testing are explicitly unavailable unless an isolated toolchain is configured.</div><section class="ws-card" style="margin-top:16px"><h2>Security findings (${items.length})</h2>${items.length?items.map(BugWorkspace.findingCard).join(""):"<div class=\"ws-empty\">No static security findings in this scan.</div>"}</section>`;});</script></body></html>
