<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="projects"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content");root.innerHTML=`<div class="ws-grid cols-2"><section class="ws-card"><h2>Create project</h2><p class="ws-muted">Select source files or a folder. ZIP import remains available from the existing Workspace upload panel.</p><input class="ws-input" id="project-name" value="My project" aria-label="Project name"><input class="ws-input" id="project-files" type="file" multiple webkitdirectory style="margin-top:10px"><div class="ws-toolbar" style="margin-top:12px"><button class="ws-button primary" id="create-project">Create project</button><a class="ws-button" href="dashboard.html">ZIP / GitHub import</a></div></section><section class="ws-card"><h2>Selected project</h2><div id="project-detail" class="ws-empty">Choose a project below.</div></section></div><section class="ws-card" style="margin-top:16px"><div class="ws-toolbar"><h2 style="margin:0">Projects</h2><button class="ws-button" id="refresh">Refresh</button></div><div id="projects-list" class="ws-empty">Loading…</div></section>`;
async function render(){const projects=await BugWorkspace.loadProjects();document.getElementById("projects-list").innerHTML=projects.length?`<table class="ws-table"><thead><tr><th>Name</th><th>Languages</th><th>Files</th><th>Last analysis</th><th></th></tr></thead><tbody>${projects.map(p=>`<tr><td>${BugWorkspace.esc(p.name)}</td><td>${BugWorkspace.esc(p.languages.join(", ")||"Unknown")}</td><td>${p.fileCount}</td><td>${p.lastAnalysis?BugWorkspace.esc(p.lastAnalysis.verification.status):"Not analyzed"}</td><td><button class="ws-button" data-open="${p.id}">Open</button> <button class="ws-button danger" data-delete="${p.id}">Delete</button></td></tr>`).join("")}</tbody></table>`:"<div class=\"ws-empty\">No projects yet.</div>";document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>open(b.dataset.open));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this project? Source files will be removed from BUG AI storage.")){await App.api(`/projects/${b.dataset.delete}`,{method:"DELETE"});if(BugWorkspace.selectedProject()===b.dataset.delete)BugWorkspace.setContext({projectId:"",file:""});render();}});}
async function open(id){const data=await App.api(`/projects/${id}`);const p=data.project;BugWorkspace.setContext({projectId:id,file:""});document.getElementById("project-detail").innerHTML=`<h3>${BugWorkspace.esc(p.name)}</h3><p class="ws-muted">${p.fileCount} files · ${BugWorkspace.esc(p.languages.join(", ")||"unknown language")}</p><p>Manifests: ${BugWorkspace.esc(p.manifests.join(", ")||"none detected")}</p><div class="ws-toolbar"><button class="ws-button primary" id="open-studio">Open Studio</button><button class="ws-button" id="analyze-project">Analyze project</button><a class="ws-button" href="architecture.html">Architecture</a><a class="ws-button" href="dependencies.html">Dependencies</a></div><p id="project-status" class="ws-muted"></p>`;document.getElementById("open-studio").onclick=()=>location.href="studio.html";document.getElementById("analyze-project").onclick=async()=>{const status=document.getElementById("project-status");status.textContent="Analyzing project…";const result=await App.api(`/projects/${id}/analyze`,{method:"POST"});BugWorkspace.setContext({scan:result.analysis});status.textContent=`${result.analysis.summary.totalFindings} findings. ${result.analysis.verification.status}.`;render();};}
document.getElementById("create-project").onclick=async()=>{const selected=[...document.getElementById("project-files").files];if(!selected.length)return App.showToast("Select one or more source files.","warning","No files");const files=await Promise.all(selected.slice(0,100).map(async f=>({name:f.webkitRelativePath||f.name,content:(await f.text()).slice(0,200000)})));try{const result=await App.api("/projects",{method:"POST",body:{name:document.getElementById("project-name").value,files}});await render();open(result.project.id);App.showToast("Project created.");}catch(error){App.showToast(error.message,"error","Create failed");}};document.getElementById("refresh").onclick=render;await render();if(BugWorkspace.selectedProject())open(BugWorkspace.selectedProject());});
</script></body></html>
