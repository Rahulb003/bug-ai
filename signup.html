<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | BUG AI</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><div class="auth-bg"></div>
<div class="auth-wrap">
  <header class="auth-top">
    <a class="auth-brand" href="index.html"><span class="ws-brand-mark" id="brand-mark"></span><span><b>BUG AI</b><small>Code Smarter. Build Safer.</small></span></a>
    <nav class="auth-nav"><a class="ws-button" href="login.html">Sign in</a></nav>
  </header>
  <section class="ws-card auth-card m-rise">
    <h2>Create your account</h2>
    <p>Projects, scans and history are stored under this account.</p>
    <form id="signup-form" autocomplete="on">
      <label for="username">Username</label>
      <input class="ws-input" id="username" name="username" autocomplete="username" minlength="3" required>
      <label for="email">Email</label>
      <input class="ws-input" id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input class="ws-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="ws-button primary" id="signup-btn" type="submit">Create account</button>
    </form>
    <div class="auth-status" id="server-status"></div>
    <p class="alt">Already have an account? <a href="login.html">Sign in</a></p>
  </section>
</div>
<script src="ui.js"></script><script src="workspace.js"></script><script src="motion.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("brand-mark").innerHTML = BugWorkspace.icon("bot");
  if (App.isAuthenticated()) { location.replace("dashboard.html"); return; }
  const status = document.getElementById("server-status");
  const ok = await App.checkServerConnection();
  status.textContent = ok ? "" : "Backend not reachable. Start the server with npm start, then refresh.";
  status.classList.toggle("bad", !ok);
  document.getElementById("signup-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const btn = document.getElementById("signup-btn");
    try {
      await BugMotion.busy(btn, App.api("/auth/register", { method: "POST", body: { username: document.getElementById("username").value, email: document.getElementById("email").value, password: document.getElementById("password").value } }).then((session) => { App.saveSession(session); }), { busyLabel: "Creating…", doneLabel: "✓ Created", holdMs: 300 });
      try { sessionStorage.removeItem("bugai_booted"); } catch { /* ignore */ }
      location.href = "dashboard.html";
    } catch (error) { status.textContent = error.message; status.classList.add("bad"); }
  });
});
</script></body></html>
