<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Review | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="review"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),scan=BugWorkspace.requireScan(root);if(!scan)return;const bySource=(scan.findings||[]).reduce((m,x)=>{(m[x.source||"deterministic"]??=[]).push(x);return m;},{});root.innerHTML=`<div class="ws-notice">Review separates deterministic evidence from AI-only suggestions. AI-only issues are not confirmed defects.</div>${Object.entries(bySource).map(([source,items])=>`<section class="ws-card" style="margin-top:16px"><h2>${BugWorkspace.esc(source)} findings</h2>${items.map(BugWorkspace.findingCard).join("")}</section>`).join("")||"<div class=\"ws-empty\">No active findings to review.</div>"}`);</script></body></html>
