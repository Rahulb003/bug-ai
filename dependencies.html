<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dependencies | BUG AI</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page" data-page="dependencies"><div id="workspace-shell"></div><script src="ui.js"></script><script src="workspace.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{if(!App.requireAuth())return;const root=document.getElementById("workspace-content"),id=BugWorkspace.selectedProject();if(!id){root.innerHTML="<div class='ws-empty'><h2>No project selected</h2><a class='ws-button primary' href='projects.html'>Open Projects</a></div>";return;}try{const {dependencies:d}=await App.api(`/projects/${id}/dependencies`);root.innerHTML=`<div class="ws-notice">Vulnerability status: <b>${BugWorkspace.esc(d.vulnerabilityStatus)}</b>. ${BugWorkspace.esc(d.vulnerabilityReason)}</div><div class="ws-grid cols-2" style="margin-top:16px"><section class="ws-card"><h2>Declared dependencies</h2><ul>${d.declared.length?d.declared.map(x=>`<li>${BugWorkspace.esc(x)}</li>`).join(""):"<li class=\"ws-muted\">No supported manifest dependencies detected.</li>"}</ul></section><section class="ws-card"><h2>Imported packages</h2><ul>${d.imported.length?d.imported.map(x=>`<li>${BugWorkspace.esc(x)}</li>`).join(""):"<li class=\"ws-muted\">No external imports detected.</li>"}</ul></section></div><section class="ws-card" style="margin-top:16px"><h2>Dependency edges</h2><pre class="ws-code">${BugWorkspace.esc(JSON.stringify(d.edges,null,2))}</pre></section>`;}catch(e){root.innerHTML=`<div class="ws-empty">${BugWorkspace.esc(e.message)}</div>`;}});</script></body></html>
